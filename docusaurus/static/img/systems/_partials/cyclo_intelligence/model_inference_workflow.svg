<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="360" viewBox="0 0 1760 360" role="img" aria-labelledby="title desc">
  <title id="title">Model Inference Workflow</title>
  <desc id="desc">A workflow diagram showing the model inference order: open the Inference page, select model and backend, configure policy settings, test in 3D simulation, and deploy to the real robot.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#59606a" />
    </marker>
    <style>
      .background { fill: #ffffff; }
      .title { fill: #374151; font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #111827; stroke-width: 3; }
      .step { fill: #2563eb; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0; }
      .label { fill: #1f2937; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 0; }
      .hint { fill: #59606a; font-family: Arial, Helvetica, sans-serif; font-size: 20px; letter-spacing: 0; }
      .arrow { stroke: #59606a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .accent-blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .accent-green { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 2; }
      .accent-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 2; }
      .accent-purple { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 2; }
      .accent-red { fill: #fff1f2; stroke: #fecdd3; stroke-width: 2; }
      .icon { fill: none; stroke: #111827; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="background" width="1760" height="360" />
  <text class="title" x="880" y="56" text-anchor="middle">Model Inference Workflow</text>

  <g transform="translate(50 90)">
    <rect class="card" x="0" y="0" width="280" height="230" rx="34" />
    <text class="step" x="140" y="36" text-anchor="middle">STEP 1</text>
    <rect class="accent-blue" x="101" y="54" width="78" height="78" rx="20" />
    <g transform="translate(101 54)">
      <path class="icon" d="M20 22 H58 V56 H20 Z" />
      <path class="icon" d="M29 68 H49" />
      <path class="icon" d="M39 56 V68" />
      <path class="icon" d="M29 33 H49" />
      <path class="icon" d="M29 44 H42" />
    </g>
    <text class="label" x="140" y="174" text-anchor="middle">Open</text>
    <text class="label" x="140" y="207" text-anchor="middle">Inference Page</text>
  </g>

  <line class="arrow" x1="345" y1="205" x2="380" y2="205" />

  <g transform="translate(395 90)">
    <rect class="card" x="0" y="0" width="280" height="230" rx="34" />
    <text class="step" x="140" y="36" text-anchor="middle">STEP 2</text>
    <rect class="accent-green" x="101" y="54" width="78" height="78" rx="20" />
    <g transform="translate(101 54)">
      <path class="icon" d="M24 21 H57 V54 H24 Z" />
      <path class="icon" d="M16 29 H24" />
      <path class="icon" d="M16 46 H24" />
      <path class="icon" d="M32 62 H49" />
      <path class="icon" d="M41 54 V62" />
      <path class="icon" d="M36 32 L49 39 L36 46 Z" />
    </g>
    <text class="label" x="140" y="174" text-anchor="middle">Select Model</text>
    <text class="hint" x="140" y="204" text-anchor="middle">Start backend Docker</text>
  </g>

  <line class="arrow" x1="690" y1="205" x2="725" y2="205" />

  <g transform="translate(740 90)">
    <rect class="card" x="0" y="0" width="280" height="230" rx="34" />
    <text class="step" x="140" y="36" text-anchor="middle">STEP 3</text>
    <rect class="accent-amber" x="101" y="54" width="78" height="78" rx="20" />
    <g transform="translate(101 54)">
      <path class="icon" d="M22 25 H57" />
      <path class="icon" d="M22 40 H57" />
      <path class="icon" d="M22 55 H57" />
      <circle class="icon" cx="31" cy="25" r="5" />
      <circle class="icon" cx="47" cy="40" r="5" />
      <circle class="icon" cx="36" cy="55" r="5" />
    </g>
    <text class="label" x="140" y="174" text-anchor="middle">Configure</text>
    <text class="hint" x="140" y="204" text-anchor="middle">Path, Hz, Async/Sync</text>
  </g>

  <line class="arrow" x1="1035" y1="205" x2="1070" y2="205" />

  <g transform="translate(1085 90)">
    <rect class="card" x="0" y="0" width="280" height="230" rx="34" />
    <text class="step" x="140" y="36" text-anchor="middle">STEP 4</text>
    <rect class="accent-purple" x="101" y="54" width="78" height="78" rx="20" />
    <g transform="translate(101 54)">
      <path class="icon" d="M18 52 C28 30 50 30 60 52" />
      <path class="icon" d="M28 52 H50" />
      <circle class="icon" cx="28" cy="58" r="5" />
      <circle class="icon" cx="50" cy="58" r="5" />
      <path class="icon" d="M37 23 L50 36 H40 L49 49" />
    </g>
    <text class="label" x="140" y="174" text-anchor="middle">Test in</text>
    <text class="label" x="140" y="207" text-anchor="middle">3D Sim Deploy</text>
  </g>

  <line class="arrow" x1="1380" y1="205" x2="1415" y2="205" />

  <g transform="translate(1430 90)">
    <rect class="card" x="0" y="0" width="280" height="230" rx="34" />
    <text class="step" x="140" y="36" text-anchor="middle">STEP 5</text>
    <rect class="accent-red" x="101" y="54" width="78" height="78" rx="20" />
    <g transform="translate(101 54)">
      <path class="icon" d="M39 14 L62 27 V51 L39 64 L16 51 V27 Z" />
      <path class="icon" d="M39 14 V38" />
      <path class="icon" d="M16 27 L39 38 L62 27" />
      <path class="icon" d="M39 38 V64" />
    </g>
    <text class="label" x="140" y="174" text-anchor="middle">Deploy to</text>
    <text class="label" x="140" y="207" text-anchor="middle">Real Robot</text>
  </g>
</svg>
