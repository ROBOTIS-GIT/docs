<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">OMX system overview</title><desc id="desc">The open_manipulator Docker container on the user PC runs the ROS 2 nodes, controllers and drivers. It uses host storage through bind mounts and talks through a Zenoh router started with zenohd. An optional external PC joins the ROS 2 network. The container exchanges commands and state with the OMX-F follower, the OMX-L leader and the USB camera.</desc>
