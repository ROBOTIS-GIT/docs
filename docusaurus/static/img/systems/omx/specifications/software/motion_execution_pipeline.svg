<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="830" viewBox="0 0 1080 830" role="img" aria-labelledby="title desc">
<title id="title">OMX motion execution pipeline</title><desc id="desc">Leader or AI policy inputs flow through ROS 2 command topics, ros2_control controllers, the DYNAMIXEL hardware interface and SDK, and DYNAMIXEL-X actuators. Joint-state feedback returns to the input workflow. A USB camera driver supplies ROS 2 sensor topics to the input workflow.</desc>
<defs>
<marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#397b72"/></marker>
<marker id="copper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#a36a37"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#70688c"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59686e"/></marker>
</defs>
