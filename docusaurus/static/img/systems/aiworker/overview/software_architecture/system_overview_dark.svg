<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">AI Worker system overview</title><desc id="desc">User PC connects to the Zenoh router on the robot PC. Host source and workspace data bind mount into the ai_worker Docker container. ROS 2 nodes, controllers and drivers communicate with the router and robot hardware.</desc>
