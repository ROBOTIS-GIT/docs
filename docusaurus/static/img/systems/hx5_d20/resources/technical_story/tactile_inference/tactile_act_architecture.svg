<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Tactile ACT architecture</title>
  <desc id="desc">A single head camera, 54-dimensional robot state, and 90 tactile taxels are encoded by ACT. The decoder predicts a 16 by 54 action chunk. At deployment, the first four steps are consumed and only the right arm and right hand, 27 dimensions, are published.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f3f8f6"/>
    </linearGradient>
    <linearGradient id="encoder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="decoder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffedd5"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="tactile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, Pretendard, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Inter, Pretendard, Arial, sans-serif; fill: #475569; }
      .label { font: 700 22px Inter, Pretendard, Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 17px Inter, Pretendard, Arial, sans-serif; fill: #334155; }
      .small { font: 500 15px Inter, Pretendard, Arial, sans-serif; fill: #475569; }
      .mono { font: 650 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .card { stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <text x="64" y="67" class="title">Tactile ACT: model and deployment flow</text>
  <text x="64" y="101" class="subtitle">Tactile information is added as encoder tokens; the ACT decoder and action head remain unchanged.</text>

  <text x="72" y="153" class="small" letter-spacing="1.8">OBSERVATIONS</text>

  <rect x="64" y="174" width="300" height="132" rx="18" fill="#ffffff" class="card"/>
  <rect x="84" y="194" width="78" height="74" rx="10" fill="#e2e8f0"/>
  <circle cx="123" cy="231" r="18" fill="#94a3b8"/>
  <path d="M96 257 L116 239 L128 250 L142 235 L155 257 Z" fill="#64748b" opacity=".7"/>
  <text x="182" y="220" class="label">Head RGB</text>
  <text x="182" y="250" class="mono">[B, 3, 720, 1280]</text>
  <text x="182" y="279" class="small">one ZED view</text>

  <rect x="64" y="329" width="300" height="132" rx="18" fill="#ffffff" class="card"/>
  <g transform="translate(89 354)">
    <rect width="58" height="58" rx="12" fill="#dbeafe"/>
    <path d="M14 41 L24 25 L34 34 L45 17" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="182" y="375" class="label">Robot state</text>
  <text x="182" y="405" class="mono">[B, 54]</text>
  <text x="182" y="434" class="small">both arms + both hands</text>

  <rect x="64" y="484" width="300" height="190" rx="18" fill="#ffffff" class="card"/>
  <g transform="translate(88 513)" fill="#86efac" stroke="#16a34a" stroke-width="1.5">
    <rect x="0" y="0" width="18" height="18" rx="4"/><rect x="23" y="0" width="18" height="18" rx="4"/><rect x="46" y="0" width="18" height="18" rx="4"/>
    <rect x="0" y="23" width="18" height="18" rx="4"/><rect x="23" y="23" width="18" height="18" rx="4"/><rect x="46" y="23" width="18" height="18" rx="4"/>
    <rect x="0" y="46" width="18" height="18" rx="4"/><rect x="23" y="46" width="18" height="18" rx="4"/><rect x="46" y="46" width="18" height="18" rx="4"/>
  </g>
  <text x="182" y="525" class="label">Tactile</text>
  <text x="182" y="555" class="mono">2 × [B, 5, 3, 3]</text>
  <text x="182" y="584" class="small">left: zero-filled</text>
  <text x="182" y="609" class="small">right: baseline-corrected</text>
  <rect x="88" y="642" width="246" height="20" rx="10" fill="#dcfce7"/>
  <rect x="88" y="642" width="172" height="20" rx="10" fill="#22c55e" opacity=".65"/>

  <text x="429" y="153" class="small" letter-spacing="1.8">FEATURE ENCODING</text>
  <rect x="408" y="174" width="246" height="132" rx="18" fill="#ffffff" class="card"/>
  <text x="531" y="219" text-anchor="middle" class="label">ResNet-18</text>
  <text x="531" y="252" text-anchor="middle" class="body">visual feature map</text>
  <text x="531" y="279" text-anchor="middle" class="small">+ 2D position embedding</text>

  <rect x="408" y="329" width="246" height="132" rx="18" fill="#ffffff" class="card"/>
  <text x="531" y="376" text-anchor="middle" class="label">Linear projection</text>
  <text x="531" y="410" text-anchor="middle" class="mono">54 → 512</text>
  <text x="531" y="438" text-anchor="middle" class="small">one state token</text>

  <rect x="408" y="484" width="246" height="190" rx="18" fill="url(#tactile)" class="card"/>
  <text x="531" y="527" text-anchor="middle" class="label">Tactile encoders</text>
  <text x="531" y="559" text-anchor="middle" class="mono">1 → 128 → 512</text>
  <text x="531" y="590" text-anchor="middle" class="body">+ learned positions</text>
  <text x="531" y="620" text-anchor="middle" class="mono">45 + 45 tokens</text>
  <text x="531" y="648" text-anchor="middle" class="small">one shared MLP per hand</text>

  <path d="M364 240 H398" class="arrow"/>
  <path d="M364 395 H398" class="arrow"/>
  <path d="M364 579 H398" class="arrow"/>

  <text x="718" y="153" class="small" letter-spacing="1.8">ACT POLICY</text>
  <rect x="699" y="174" width="310" height="500" rx="22" fill="url(#encoder)" class="card"/>
  <rect x="731" y="210" width="246" height="72" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="854" y="240" text-anchor="middle" class="body">VAE latent token</text>
  <text x="854" y="266" text-anchor="middle" class="mono">z: 32 → 512</text>

  <text x="854" y="352" text-anchor="middle" class="label">Transformer encoder</text>
  <text x="854" y="386" text-anchor="middle" class="body">latent + state + tactile + image</text>
  <text x="854" y="426" text-anchor="middle" class="mono">4 layers · dim 512 · 8 heads</text>
  <g transform="translate(747 474)">
    <rect x="0" y="0" width="52" height="52" rx="9" fill="#93c5fd"/>
    <rect x="63" y="0" width="52" height="52" rx="9" fill="#86efac"/>
    <rect x="126" y="0" width="52" height="52" rx="9" fill="#fbbf24"/>
    <rect x="189" y="0" width="52" height="52" rx="9" fill="#c4b5fd"/>
  </g>
  <text x="854" y="557" text-anchor="middle" class="small">shared multimodal representation</text>
  <text x="854" y="615" text-anchor="middle" class="small">Training: z sampled from action + state</text>
  <text x="854" y="641" text-anchor="middle" class="small">Inference: z = 0</text>

  <path d="M654 240 H689" class="arrow"/>
  <path d="M654 395 H689" class="arrow"/>
  <path d="M654 579 H689" class="arrow"/>

  <rect x="1054" y="244" width="254" height="360" rx="22" fill="url(#decoder)" class="card"/>
  <text x="1181" y="293" text-anchor="middle" class="label">Transformer decoder</text>
  <text x="1181" y="329" text-anchor="middle" class="mono">1 layer · 8 heads</text>
  <text x="1181" y="370" text-anchor="middle" class="body">16 zero-initialized slots</text>
  <text x="1181" y="395" text-anchor="middle" class="small">+ learned query positions</text>
  <g transform="translate(1092 408)">
    <rect x="0" y="0" width="27" height="44" rx="7" fill="#fdba74"/>
    <rect x="36" y="0" width="27" height="44" rx="7" fill="#fb923c"/>
    <rect x="72" y="0" width="27" height="44" rx="7" fill="#fdba74"/>
    <text x="117" y="30" class="label">…</text>
    <rect x="151" y="0" width="27" height="44" rx="7" fill="#fb923c"/>
  </g>
  <path d="M1090 492 H1272" stroke="#c2410c" stroke-width="2"/>
  <text x="1181" y="533" text-anchor="middle" class="body">action head</text>
  <text x="1181" y="566" text-anchor="middle" class="mono">[B, 16, 54]</text>

  <path d="M1009 424 H1044" class="arrow"/>

  <rect x="1352" y="208" width="194" height="428" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="10 8" filter="url(#shadow)"/>
  <text x="1449" y="251" text-anchor="middle" class="small" letter-spacing="1.6">DEPLOYMENT</text>
  <text x="1449" y="300" text-anchor="middle" class="label">Queue</text>
  <text x="1449" y="330" text-anchor="middle" class="mono">first 4 steps</text>
  <path d="M1388 367 H1510" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1449" y="411" text-anchor="middle" class="label">Select</text>
  <text x="1449" y="441" text-anchor="middle" class="body">right arm + hand</text>
  <path d="M1388 478 H1510" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1449" y="526" text-anchor="middle" class="label">Publish</text>
  <text x="1449" y="558" text-anchor="middle" class="mono">27-D command</text>
  <text x="1449" y="594" text-anchor="middle" class="small">left side blocked</text>

  <path d="M1308 424 H1342" class="arrow"/>

  <rect x="699" y="714" width="847" height="58" rx="15" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1122" y="750" text-anchor="middle" class="body">Model boundary: tactile tokens are part of ACT · Deployment selection is a runtime safety contract</text>
</svg>
