<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Per-taxel tactile encoder detail</title>
  <desc id="desc">Each hand provides five 3 by 3 tactile grids. The 45 scalar taxels share one hand-specific MLP, producing 45 512-dimensional tokens. A separate learned positional embedding is added for each taxel. Left and right hand MLPs use independent weights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="expert" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <symbol id="grid" viewBox="0 0 66 66">
      <g fill="#86efac" stroke="#15803d" stroke-width="1.5">
        <rect x="1" y="1" width="18" height="18" rx="4"/><rect x="24" y="1" width="18" height="18" rx="4"/><rect x="47" y="1" width="18" height="18" rx="4"/>
        <rect x="1" y="24" width="18" height="18" rx="4"/><rect x="24" y="24" width="18" height="18" rx="4"/><rect x="47" y="24" width="18" height="18" rx="4"/>
        <rect x="1" y="47" width="18" height="18" rx="4"/><rect x="24" y="47" width="18" height="18" rx="4"/><rect x="47" y="47" width="18" height="18" rx="4"/>
      </g>
    </symbol>
    <style>
      .title { font: 700 36px Inter, Pretendard, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Inter, Pretendard, Arial, sans-serif; fill: #475569; }
      .label { font: 700 21px Inter, Pretendard, Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 17px Inter, Pretendard, Arial, sans-serif; fill: #334155; }
      .small { font: 500 15px Inter, Pretendard, Arial, sans-serif; fill: #475569; }
      .mono { font: 650 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .card { stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1500" height="760" rx="28" fill="url(#bg)"/>
  <text x="62" y="64" class="title">Per-taxel tactile encoder</text>
  <text x="62" y="98" class="subtitle">The two branches share the same structure, but not their weights.</text>

  <rect x="50" y="136" width="1400" height="242" rx="22" fill="#ffffff" class="card"/>
  <rect x="50" y="402" width="1400" height="242" rx="22" fill="#ffffff" class="card"/>
  <rect x="50" y="136" width="14" height="242" rx="7" fill="#94a3b8"/>
  <rect x="50" y="402" width="14" height="242" rx="7" fill="#22c55e"/>

  <text x="88" y="177" class="label">Left hand</text>
  <text x="88" y="203" class="small">zero-filled for this right-hand task</text>
  <text x="88" y="443" class="label">Right hand</text>
  <text x="88" y="469" class="small">baseline-corrected live pressure</text>

  <g transform="translate(88 222)">
    <use href="#grid" x="0" width="58" height="58" opacity=".55"/><use href="#grid" x="68" width="58" height="58" opacity=".55"/><use href="#grid" x="136" width="58" height="58" opacity=".55"/><use href="#grid" x="204" width="58" height="58" opacity=".55"/><use href="#grid" x="272" width="58" height="58" opacity=".55"/>
    <text x="165" y="83" text-anchor="middle" class="mono">[B, 5, 3, 3]</text>
  </g>
  <g transform="translate(88 488)">
    <use href="#grid" x="0" width="58" height="58"/><use href="#grid" x="68" width="58" height="58"/><use href="#grid" x="136" width="58" height="58"/><use href="#grid" x="204" width="58" height="58"/><use href="#grid" x="272" width="58" height="58"/>
    <text x="165" y="83" text-anchor="middle" class="mono">[B, 5, 3, 3]</text>
  </g>

  <path d="M430 258 H490" class="arrow"/><path d="M430 524 H490" class="arrow"/>
  <rect x="505" y="188" width="145" height="138" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="505" y="454" width="145" height="138" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="577" y="236" text-anchor="middle" class="label">Flatten</text>
  <text x="577" y="272" text-anchor="middle" class="mono">45 taxels</text>
  <text x="577" y="300" text-anchor="middle" class="mono">[B,45,1]</text>
  <text x="577" y="502" text-anchor="middle" class="label">Flatten</text>
  <text x="577" y="538" text-anchor="middle" class="mono">45 taxels</text>
  <text x="577" y="566" text-anchor="middle" class="mono">[B,45,1]</text>

  <path d="M650 258 H710" class="arrow"/><path d="M650 524 H710" class="arrow"/>
  <rect x="725" y="166" width="286" height="182" rx="20" fill="url(#expert)" stroke="#86efac" filter="url(#shadow)"/>
  <rect x="725" y="432" width="286" height="182" rx="20" fill="url(#expert)" stroke="#86efac" filter="url(#shadow)"/>
  <text x="868" y="205" text-anchor="middle" class="label">Left-hand MLP</text>
  <text x="868" y="238" text-anchor="middle" class="mono">Linear 1 → 128</text>
  <text x="868" y="269" text-anchor="middle" class="body">ReLU</text>
  <text x="868" y="300" text-anchor="middle" class="mono">Linear 128 → 512</text>
  <text x="868" y="329" text-anchor="middle" class="body">LayerNorm(512)</text>
  <text x="868" y="471" text-anchor="middle" class="label">Right-hand MLP</text>
  <text x="868" y="504" text-anchor="middle" class="mono">Linear 1 → 128</text>
  <text x="868" y="535" text-anchor="middle" class="body">ReLU</text>
  <text x="868" y="566" text-anchor="middle" class="mono">Linear 128 → 512</text>
  <text x="868" y="595" text-anchor="middle" class="body">LayerNorm(512)</text>

  <path d="M1011 258 H1062" class="arrow"/><path d="M1011 524 H1062" class="arrow"/>
  <rect x="1077" y="184" width="180" height="146" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="1077" y="450" width="180" height="146" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1167" y="226" text-anchor="middle" class="label">MLP tokens</text>
  <text x="1167" y="260" text-anchor="middle" class="mono">[B,45,512]</text>
  <text x="1167" y="293" text-anchor="middle" class="body">+ position [45,512]</text>
  <text x="1167" y="492" text-anchor="middle" class="label">MLP tokens</text>
  <text x="1167" y="526" text-anchor="middle" class="mono">[B,45,512]</text>
  <text x="1167" y="559" text-anchor="middle" class="body">+ position [45,512]</text>

  <path d="M1257 258 C1292 258 1284 372 1312 392" class="arrow"/>
  <path d="M1257 524 C1292 524 1284 440 1312 422" class="arrow"/>
  <rect x="1322" y="335" width="110" height="142" rx="18" fill="#ecfccb" stroke="#84cc16" filter="url(#shadow)"/>
  <text x="1377" y="381" text-anchor="middle" class="label">Concat</text>
  <text x="1377" y="416" text-anchor="middle" class="mono">90</text>
  <text x="1377" y="445" text-anchor="middle" class="small">tokens</text>

  <rect x="250" y="670" width="1000" height="70" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="750" y="698" text-anchor="middle" class="body">Within each hand, one MLP is shared across all 45 taxels.</text>
  <text x="750" y="723" text-anchor="middle" class="body">Learned positions identify each taxel; MLP tokens encode its pressure.</text>
</svg>
