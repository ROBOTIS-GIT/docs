name: Deploy Docusaurus site to Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 동시 배포는 1개만, 진행 중인 배포는 취소하지 않음
concurrency:
  # Ignored CI events must not replace a pending real deployment in this group.
  group: >-
    ${{ (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
        && 'pages' || format('pages-ignored-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus and collect previews
    # Only the trusted default branch is executed, including on PR-related events.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: read
      pages: read
      pull-requests: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docusaurus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # showLastUpdateTime이 git history 전체를 필요로 함
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docusaurus/package-lock.json
            docusaurus/omx-assembly/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix omx-assembly

      - name: Test interactive assembly guide
        run: npm run test:omx

      - name: Type check
        run: npm run typecheck

      - name: Build English website
        env:
          # 일부 cosmetic SSG 경고(예: image broken 워닝, HTML minifier diagnostics)
          # 가 GitHub Actions에서 error로 승격되어 빌드를 차단하는 것을 막음.
          # 로컬 빌드는 여전히 SUCCESS이고, 워닝은 build 로그에 출력됨.
          DOCUSAURUS_IGNORE_SSG_WARNINGS: 'true'
          # Production: https://docs.robotis.com (GitHub Pages custom domain)
          DOCUSAURUS_URL: 'https://docs.robotis.com'
          DOCUSAURUS_BASE_URL: '/'
          DOCUSAURUS_ON_BROKEN_LINKS: 'warn'
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --locale en

      - name: Build Korean website
        env:
          DOCUSAURUS_IGNORE_SSG_WARNINGS: 'true'
          DOCUSAURUS_URL: 'https://docs.robotis.com'
          DOCUSAURUS_BASE_URL: '/'
          DOCUSAURUS_ON_BROKEN_LINKS: 'warn'
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --locale ko

      - name: Check build output
        working-directory: ./
        run: |
          test -d docusaurus/build
          test -f docusaurus/build/index.html
          test -d docusaurus/build/ko
          test -f docusaurus/build/ko/index.html
          test -f docusaurus/build/interactive/omx/index.html
          test ! -d docusaurus/build/ko/interactive/omx

      - name: Collect validated previews for open PRs
        working-directory: ./
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pages-previews.py collect docusaurus/build preview-status.json

      - name: Save comment status
        uses: actions/upload-artifact@v4
        with:
          name: preview-status
          path: preview-status.json
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docusaurus/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  comments:
    name: Update PR preview comments
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout trusted comment script
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download deployment status
        uses: actions/download-artifact@v4
        with:
          name: preview-status

      - name: Update comments after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ORIGIN: https://docs.robotis.com
        run: python3 .github/scripts/pages-previews.py comment preview-status.json
