name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docs_ci
    runs-on: ubuntu-latest
    env:
      DOCUSAURUS_BASE_URL: ${{ github.event_name == 'pull_request' && format('/pr-preview/{0}/', github.event.pull_request.number) || '/' }}
    defaults:
      run:
        working-directory: ./docusaurus
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            docusaurus/package-lock.json
            docusaurus/omx-assembly/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix omx-assembly

      - name: Test preview tooling
        working-directory: ./
        run: |
          node --test docusaurus/scripts/pr-preview.test.mjs docusaurus/scripts/dedupe-media.test.mjs
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test interactive assembly guide
        run: npm run test:omx

      - name: Type check
        run: npm run typecheck

      - name: Build English site
        env:
          DOCUSAURUS_IGNORE_SSG_WARNINGS: 'true'
          DOCUSAURUS_URL: 'https://docs.robotis.com'
          DOCUSAURUS_ON_BROKEN_LINKS: 'warn'
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --locale en

      - name: Build Korean site
        env:
          DOCUSAURUS_IGNORE_SSG_WARNINGS: 'true'
          DOCUSAURUS_URL: 'https://docs.robotis.com'
          DOCUSAURUS_ON_BROKEN_LINKS: 'warn'
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --locale ko

      - name: Check build output
        working-directory: ./
        run: |
          test -d docusaurus/build
          test -f docusaurus/build/index.html
          test -d docusaurus/build/ko
          test -f docusaurus/build/ko/index.html
          test -f docusaurus/build/interactive/omx/index.html
          test ! -d docusaurus/build/ko/interactive/omx

      - name: Package changed-page preview
        if: github.event_name == 'pull_request'
        working-directory: ./
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node docusaurus/scripts/pr-preview.mjs

      - name: Upload changed-page preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ github.event.pull_request.number }}
          path: pr-preview/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            docusaurus/build
            docusaurus/.docusaurus
          retention-days: 7
