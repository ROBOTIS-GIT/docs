services:
  docs:
    container_name: robotis-docs
    build:
      # The build context is docusaurus; the Dockerfile is in the repository root.
      context: ./docusaurus
      dockerfile: ../Dockerfile
    volumes:
      # Mount all source files, including i18n, so builds use the latest content.
      - ./docusaurus:/app
      # Preserve node_modules from the image because it is absent on the host.
      - /app/node_modules
    ports:
      - "5714:5714"
    restart: unless-stopped
